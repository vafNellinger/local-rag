# Plattformklassen und Rollenzuweisung.
#
# Die Klassifizierung erfolgt in rag/detect.py anhand von nutzbarem VRAM und
# der Frage, ob der Speicher mit der CPU geteilt wird (iGPU). Jede Klasse legt
# pro Rolle fest, auf welchem Gerät das Modell läuft.
#
# Grundregel für die Gerätezuweisung: die GPU gehört der Rolle, an der die
# Antwortlatenz hängt — dem Generator. Embedding ist beim Ingest Batch-Arbeit
# und darf langsamer sein; der Reranker sieht pro Query nur ~20 kurze
# Kandidaten. Auf knappem VRAM wandern beide auf die CPU, damit der Generator
# sein Kontextfenster behält.

[roles]
# Rollen, die das System kennt. "generator" wird dynamisch über whichllm
# aufgelöst, die übrigen über die Tabellen weiter unten.
dynamic = ["generator"]
static = ["embedder", "reranker"]


# ─── Embedder ────────────────────────────────────────────────────────────────
# Muss multilingual sein: die Zieldokumente sind überwiegend deutsch, ein
# englischlastiger Embedder ruiniert das Retrieval, bevor der Generator
# überhaupt zum Einsatz kommt.
#
# Gegen die MTEB-Zahlen von Juli 2026 geprüft. Ergebnis: bge-m3 bleibt.
#
# Die aggregierten Leaderboards führen inzwischen Qwen3-Embedding-8B (~75) und
# KaLM-Embedding-Gemma3-12B (72,3) an — beide sind für dieses Projekt
# unbrauchbar, weil sie neben dem Generator kein VRAM-Budget haben. In der
# vergleichbaren Größenklasse steht Qwen3-Embedding-0.6B (64,3 multilingual)
# gegen bge-m3 (~63,0). Die Zahlen stammen aus verschiedenen MTEB-Versionen
# und sind nicht sauber vergleichbar; der Vorsprung ist real, aber klein.
#
# Ausschlaggebend war nicht der Mittelwert, sondern dass bge-m3 dense, sparse
# und multi-vector in einem Modell liefert. Die Sparse-Vektoren erlauben
# später Hybrid-Retrieval ohne zweites Modell — bei deutschen Fachbegriffen,
# Aktenzeichen und Eigennamen bringt die lexikalische Komponente mehr als ein
# Punkt MTEB-Mittelwert. Dazu passt der Reranker aus derselben Familie.

[embedder.default]
model_id = "BAAI/bge-m3"
dimensions = 1024
max_seq_length = 8192
# Grober Resident-Bedarf in FP16, für die Budgetrechnung in resolve.py.
vram_estimate_mb = 1100
# bge-m3 braucht keine Instruktionspräfixe — Anfrage und Dokument gehen
# unverändert ins Modell. Bei den Alternativen unten ist das anders, deshalb
# steht es als Feld hier und nicht als Annahme im Code.
query_prefix = ""
passage_prefix = ""

# E5-Modelle sind auf genau diese Präfixe trainiert. Fehlen sie, sinkt die
# Retrieval-Qualität deutlich, ohne dass irgendetwas fehlschlägt — der
# gefährlichste Fall beim Umschalten. Beachte auch die 512 Token: das ist
# weniger als die Chunk-Zielgröße mal Sicherheitsfaktor, längere Chunks
# würden still abgeschnitten.
[embedder.alternative]
model_id = "intfloat/multilingual-e5-large"
dimensions = 1024
max_seq_length = 512
vram_estimate_mb = 1100
query_prefix = "query: "
passage_prefix = "passage: "

# Neuerer Kandidat, für den späteren empirischen Vergleich an echten
# deutschen Dokumenten. Kann per MRL auf kleinere Dimensionen gekürzt werden;
# die Query-Instruktion kostet laut Modellkarte 1-5 % Retrieval-Qualität,
# wenn sie fehlt.
[embedder.qwen3]
model_id = "Qwen/Qwen3-Embedding-0.6B"
dimensions = 1024
max_seq_length = 32768
vram_estimate_mb = 1300
query_prefix = "Instruct: Given a search query, retrieve relevant passages that answer it\nQuery: "
passage_prefix = ""


# ─── Reranker ────────────────────────────────────────────────────────────────

[reranker.default]
model_id = "BAAI/bge-reranker-v2-m3"
max_seq_length = 8192
vram_estimate_mb = 1100


# ─── OCR / Extraktion ────────────────────────────────────────────────────────
# Läuft über Docling (Layout, Tabellen, Überschriften) mit EasyOCR als
# Texterkennung. Nur die Ingest-Phase betroffen, nie eine Query.
#
# Messwerte auf dieser Maschine (12 Kerne, CPU):
#   ohne OCR  ~0,8 s pro Seite
#   mit OCR   ~8,5 s pro Seite
# Faktor 10 — deshalb entscheidet die Voranalyse in extract.probe() pro Seite,
# ob OCR überhaupt läuft, statt es pauschal einzuschalten.
#
# Zum Gerät: OCR könnte die GPU nutzen, weil beim Ingest kein Generator
# geladen ist. Auf dieser Maschine geht das trotzdem nicht — installiert ist
# der CUDA-Build von Torch (cuda.is_available False, kein HIP), die Radeon
# 890M bleibt für Torch unsichtbar. Dafür bräuchte es einen ROCm-Torch.
# Auf Plattformen mit NVIDIA-GPU ist "gpu" hier sinnvoll.

[ocr]
langs = ["de", "en"]
device = "cpu"


# ─── Plattformklassen ────────────────────────────────────────────────────────

[platform_class.cpu_only]
description = "Keine nutzbare GPU"
generator_device = "cpu"
embedder_device = "cpu"
reranker_device = "cpu"
# Reranking auf CPU ohne GPU-Generator verdoppelt die Query-Latenz für
# vergleichsweise wenig Qualitätsgewinn — hier optional.
reranker_enabled = false
context_length = "8k"
whichllm_args = ["--cpu-only"]

# Übersteuert [generator] für diese Klasse. Ohne GPU ist Langsamkeit
# eingepreist: whichllms "--speed usable" lässt auf CPU nur noch Modelle
# unter 2B übrig, was die globale 3B-Untergrenze unerfüllbar macht. Auf CPU
# akzeptiert man einstellige tok/s und wählt stattdessen nach Qualität.
[platform_class.cpu_only.generator]
speed = "any"
min_params_b = 1.5

[platform_class.igpu_shared]
description = "Integrierte GPU mit geteiltem Speicher (<= 10 GB)"
generator_device = "gpu"
embedder_device = "cpu"
reranker_device = "cpu"
reranker_enabled = true
context_length = "32k"
whichllm_args = []

[platform_class.dgpu_small]
description = "Dedizierte GPU, 10-20 GB"
generator_device = "gpu"
embedder_device = "gpu"
reranker_device = "cpu"
reranker_enabled = true
context_length = "32k"
whichllm_args = []

[platform_class.dgpu_large]
description = "Dedizierte GPU, > 20 GB"
generator_device = "gpu"
embedder_device = "gpu"
reranker_device = "gpu"
reranker_enabled = true
context_length = "64k"
whichllm_args = []


# ─── Generator-Auswahl ───────────────────────────────────────────────────────

[generator]
# whichllm kennt kein RAG-Profil; "general" ist die nächstbeste Annäherung.
profile = "general"
# Nur Modelle mit direkter Benchmark-Evidenz, keine vererbten Scores.
evidence = "base"
speed = "usable"

# Reasoning-Modelle kosten pro Query spürbar Latenz durch Thinking-Tokens.
# Bei RAG steht die Antwort im Kontext — der Reasoning-Aufwand zahlt sich
# kaum aus. whichllm rankt sie trotzdem nach oben, also filtern wir nach.
# Vorgriff auf das, was ein echtes rag-Profil im Tool selbst tun müsste.
exclude_name_patterns = ["thinking", "-r1-", "reasoning", "qwq"]

# Base-Modelle ohne Instruction-Tuning. Google markiert sie mit "-pt"
# (pretrained), das Gegenstück zum instruction-tuned "-it" — beides hat nichts
# mit Sprachen zu tun. Ein Base-Modell folgt keiner Anweisung und ist für RAG
# unbrauchbar. Als Endung geprüft, nicht als Substring, damit "-pt" nicht
# mitten in einem Namen fehlzündet.
exclude_name_suffixes = ["-pt"]

# Untergrenze: darunter wird Instruktionstreue auf langen Kontexten unzuverlässig.
min_params_b = 3.0

# Quantisierung unter Q4 verliert genau das, was RAG braucht — wörtliche Treue
# zum Kontext und Zitierfähigkeit. whichllms Penalty für Q3_K_M (8 %) ist dafür
# zu mild, deshalb hier eine harte Grenze.
min_quant_tier = "Q4_K_S"


# ─── Sprachfilter ────────────────────────────────────────────────────────────
# whichllm hat kein Sprachkonzept. Die HF-Model-API liefert cardData.language,
# aber lückenhaft: von 59 gemessenen Kandidaten hatten 32 gar keinen Tag,
# darunter die komplette Qwen3-Familie und Gemma — beide ausgeprägt
# multilingual. Ein harter Positiv-Filter würde also genau die besten
# Kandidaten verwerfen.
#
# Deshalb: vorhandene Tags auswerten, fehlende nicht bestrafen. Das sortiert
# in der Messung 19 tatsächlich englischzentrierte Modelle aus (Llama-2/3,
# Mistral-7B-v0.1, Phi-3, Olmo, Falcon, Qwen2.5) und lässt die untaggten durch.

[generator.language]
target = "de"

# Modelle, die auf eine andere Sprache spezialisiert sind, tragen das fast
# immer im Namen. Billigster und zuverlässigster Teil des Filters, weil ohne
# Netzzugriff.
exclude_name_patterns = [
    "japanese", "swallow", "elyza", "sarashina", "rakuten",
    "chinese", "yi-", "chatglm", "baichuan",
    "korean", "kullm", "polyglot-ko",
    "vietnamese", "vinallama",
    "vikhr", "saiga",
    "sauerkraut",  # deutsch-spezialisiert, aber Derivat ohne eigenen Benchmark
]

# Bekannter Sonderfall: Repackager übernehmen den Sprachtag nicht immer
# korrekt. unsloth/Qwen3-8B-GGUF ist als reines 'en' getaggt, obwohl das
# Originalmodell multilingual ist. Solche Repos hier freistellen, damit der
# Tag-Fehler des Repackagers das Modell nicht disqualifiziert.
ignore_tags_for = [
    "unsloth/Qwen3-8B-GGUF",
]
