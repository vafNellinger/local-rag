[project]
name = "local-rag"
version = "0.1.0"
description = "Lokales RAG-System mit plattformabhängiger Modellauswahl"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# Extraktion und Indizierung. docling bringt Torch mit (~2 GB) und lädt beim
# ersten Lauf Layout- und OCR-Modelle nach. easyocr ist explizit gelistet,
# weil docling sonst RapidOCR wählt, dessen Standardmodelle auf
# Chinesisch/Englisch zielen und bei deutschen Umlauten unzuverlässig sind.
ingest = [
    "docling>=2.116",
    "easyocr>=1.7",
    "pypdf>=5.0",
    "pillow>=10.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
]
generate = [
    "llama-cpp-python>=0.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
