[project]
name = "local-rag"
version = "0.1.0"
description = "Lokales RAG-System mit plattformabhängiger Modellauswahl"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# Extraktion und Indizierung. docling bringt Torch mit (~2 GB) und lädt beim
# ersten Lauf Layout- und OCR-Modelle nach. easyocr ist explizit gelistet,
# weil docling sonst RapidOCR wählt, dessen Standardmodelle auf
# Chinesisch/Englisch zielen und bei deutschen Umlauten unzuverlässig sind.
ingest = [
    "docling>=2.116",
    "easyocr>=1.7",
    "pypdf>=5.0",
    "pillow>=10.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
]
# Der Generator. Es gibt keine Wheels — llama-cpp-python kompiliert beim
# Installieren und braucht dafür einen C++-Compiler; cmake zieht es sich als
# Build-Abhängigkeit selbst. Der so entstehende Build kann nur CPU. Für
# GPU-Betrieb neu bauen, z.B. mit CMAKE_ARGS="-DGGML_VULKAN=ON".
generate = [
    "llama-cpp-python>=0.3",
]
# Oberfläche. NiceGUI bringt seinen eigenen Webserver mit; die Anwendung
# lauscht nur auf localhost.
gui = [
    "nicegui>=2.0",
]
# Eigenständiges Fenster statt Browser-Tab (rag gui --native). pywebview nutzt
# die im System vorhandene Webview-Engine: auf Windows das eingebaute Edge
# WebView2, auf Linux WebKitGTK. Auf Linux sind dafür Systempakete nötig
# (python3-gi, gir1.2-webkit2-4.1) und der venv muss sie sehen — deshalb baut
# der Linux-Starter ihn aus dem System-Python mit --system-site-packages. Fehlt
# eine Webview, fällt die Oberfläche automatisch auf den Browser zurück.
native = [
    "pywebview>=5.0",
]
# Alternative Vektor-Backends. Keines ist nötig — sqlite-vec steht in
# [ingest] und ist die Vorgabe. Jedes hier ist einzeln installierbar, damit
# niemand drei Vektordatenbanken mitschleppt, um eine zu benutzen.
#
# lancedb bringt pyarrow mit (~40 MB), chromadb einen ganzen Server-Stack
# samt onnxruntime, qdrant-client nur grpc. Die Größenordnungen sind der
# Grund für die Trennung.
lancedb = [
    "lancedb>=0.13",
    "pyarrow>=15.0",
]
chromadb = [
    "chromadb>=0.5",
]
qdrant = [
    "qdrant-client>=1.10",
]
dev = [
    "pytest>=8.0",
]
# Nur für tools/testkorpus.py: erzeugt die PDFs des Testkorpus mit Textlayer.
# Die gescannte Variante entsteht über pillow, das schon in [ingest] steht.
testdaten = [
    "reportlab>=4.0",
]

[project.scripts]
rag = "rag.cli:app"

[tool.pytest.ini_options]
# "slow" sind Tests, die echte Modelle laufen lassen — vor allem OCR, das
# allein rund 25 Sekunden kostet. Sie laufen standardmäßig mit, weil sie
# echte Fehler finden; für einen schnellen Durchgang: pytest -m "not slow".
markers = [
    "slow: braucht ein echtes Modell (OCR, Embedding) und dauert Sekunden",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
