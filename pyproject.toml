[project]
name = "local-rag"
version = "0.1.0"
description = "Lokales RAG-System mit plattformabhängiger Modellauswahl"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# Extraktion und Indizierung. docling bringt Torch mit (~2 GB) und lädt beim
# ersten Lauf Layout- und OCR-Modelle nach. easyocr ist explizit gelistet,
# weil docling sonst RapidOCR wählt, dessen Standardmodelle auf
# Chinesisch/Englisch zielen und bei deutschen Umlauten unzuverlässig sind.
ingest = [
    "docling>=2.116",
    "easyocr>=1.7",
    "pypdf>=5.0",
    "pillow>=10.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
]
# Der Generator. Es gibt keine Wheels — llama-cpp-python kompiliert beim
# Installieren und braucht dafür einen C++-Compiler; cmake zieht es sich als
# Build-Abhängigkeit selbst. Der so entstehende Build kann nur CPU. Für
# GPU-Betrieb neu bauen, z.B. mit CMAKE_ARGS="-DGGML_VULKAN=ON".
generate = [
    "llama-cpp-python>=0.3",
]
# Oberfläche. NiceGUI bringt seinen eigenen Webserver mit; die Anwendung
# lauscht nur auf localhost.
gui = [
    "nicegui>=2.0",
]
dev = [
    "pytest>=8.0",
]
# Nur für tools/testkorpus.py: erzeugt die PDFs des Testkorpus mit Textlayer.
# Die gescannte Variante entsteht über pillow, das schon in [ingest] steht.
testdaten = [
    "reportlab>=4.0",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
