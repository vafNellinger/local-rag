[project]
name = "local-rag"
version = "0.1.0"
description = "Lokales RAG-System mit plattformabhängiger Modellauswahl"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# Erst ab Schritt 2 (Ingest) nötig — hier bewusst noch nicht installiert,
# damit Schritt 1 ohne Torch-Download testbar bleibt.
ingest = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
]
generate = [
    "llama-cpp-python>=0.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
