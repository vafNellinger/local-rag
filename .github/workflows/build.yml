name: Build desktop bundles

# Baut auf GitHubs kostenlosen Runnern (öffentliches Repo) ein PyInstaller-Bundle
# je Betriebssystem. Erster Wurf: liefert die gepackte App als Artefakt. Die
# Wizard-Installer (NSIS/.dmg/.deb) und die Signierung kommen als nächste
# Schritte obendrauf. Manuell auslösbar und bei Versions-Tags.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: local-rag-linux-x64
          - os: windows-latest
            artifact: local-rag-windows-x64
          - os: macos-latest
            artifact: local-rag-macos-arm64
    runs-on: ${{ matrix.os }}
    # bash auf allen dreien (auch Windows, via Git Bash) — sonst scheitert die
    # \-Zeilenfortsetzung an PowerShell.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pywebview braucht auf Linux die WebKitGTK-Bindung.
      - name: System-Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 || true

      - name: Python-Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Das vorkompilierte macos-arm64-Wheel vom abetlen-Index ist korrupt
            # (BadZipFile beim Entpacken der libggml-Dylib). Stattdessen aus dem
            # sdist mit Metal kompilieren — macOS hat die Build-Tools, und Metal
            # ist auf Apple Silicon ohnehin der GPU-Weg.
            CMAKE_ARGS="-DGGML_METAL=on" pip install --no-binary llama-cpp-python llama-cpp-python
            pip install -e ".[ingest,generate,gui,native,onnx]"
          else
            # llama-cpp-python als vorkompiliertes CPU-Wheel (spart den Compiler).
            pip install -e ".[ingest,generate,gui,native,onnx]" \
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          fi
          pip install pyinstaller

      - name: Bundle bauen
        run: pyinstaller packaging/pyinstaller/local-rag.spec --noconfirm --clean

      - name: Bundle archivieren
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" local-rag
          else
            tar czf "../${{ matrix.artifact }}.tar.gz" local-rag
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore
          retention-days: 14
