name: Build desktop bundles

# Baut auf GitHubs kostenlosen Runnern je Betriebssystem ein PyInstaller-Bundle
# und daraus einen per Wizard installierbaren Installer:
#   Linux   → .deb            (Bundle nach /opt, Menü-Eintrag)
#   Windows → NSIS-Setup.exe  (Per-User, Startmenü, Deinstaller)
#   macOS   → .dmg            (.app zum Ziehen nach /Programme)
#
# Linux läuft bewusst in einem debian:trixie-CONTAINER statt auf ubuntu-latest:
# nur so passen die gebündelten GTK/GLib-Bibliotheken exakt zur System-WebKit
# auf Debian 13. Ein auf ubuntu-24.04 gebautes Bundle mischt ältere Libs mit
# neueren Debian-System-Libs und das native Fenster stirbt an
# GLib-Versionskonflikten (undefined symbol g_variant_builder_init_static).
# Lokal im Container verifiziert: so öffnet das eigenständige Fenster.
#
# Signierung passiert optional, sobald die Secrets hinterlegt sind
# (docs/standalone-app/06-installer-signing.md). Manuell auslösbar und bei Tags.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Windows und macOS auf den nativen Runnern (dort gibt es keine GLib-Kette).
  build:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: local-rag-windows-x64
          - os: macos-latest
            artifact: local-rag-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version bestimmen
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="0.1.0"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: NSIS installieren (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Python-Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Das vorkompilierte macos-arm64-Wheel vom abetlen-Index ist korrupt
            # (BadZipFile). Stattdessen aus dem sdist mit Metal kompilieren.
            CMAKE_ARGS="-DGGML_METAL=on" pip install --no-binary llama-cpp-python llama-cpp-python
            pip install -e ".[ingest,generate,gui,native,onnx]"
          else
            # Windows: PyPI-torch ist bereits CPU-only.
            pip install -e ".[ingest,generate,gui,native,onnx]" \
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          fi
          pip install pyinstaller

      - name: Bundle bauen
        run: pyinstaller packaging/pyinstaller/local-rag.spec --noconfirm --clean

      - name: Signieren – macOS App (optional)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "::notice::Kein MACOS_CERT_P12_BASE64 — App bleibt unsigniert (Gatekeeper: Rechtsklick > Öffnen)."
            exit 0
          fi
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --deep --force --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" dist/local-rag.app
          rm -f cert.p12
          echo "App signiert mit: $MACOS_SIGN_IDENTITY"

      - name: Installer NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          # choco legt makensis unter Program Files ab, aber nicht in den
          # Git-Bash-PATH — deshalb der volle Pfad. Und NSIS' File-Direktive
          # braucht einen echten Windows-Pfad mit Backslashes (cygpath -w).
          SRC_WIN="$(cygpath -w "$PWD/dist/local-rag")"
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            -DVERSION="$APP_VERSION" -DSRC="$SRC_WIN" \
            -DOUTFILE="local-rag-setup-$APP_VERSION.exe" \
            packaging/nsis/local-rag.nsi

      - name: Installer .dmg (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh "$APP_VERSION" dist/local-rag.app .

      - name: Signieren – Windows Setup (optional)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERT_BASE64:-}" ]; then
            echo "::notice::Kein WINDOWS_CERT_BASE64 — Installer bleibt unsigniert (SmartScreen-Warnung)."
            exit 0
          fi
          echo "$WINDOWS_CERT_BASE64" | base64 --decode > cert.pfx
          SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe 2>/dev/null | grep -i x64 | sort | tail -1)
          "$SIGNTOOL" sign -f cert.pfx -p "$WINDOWS_CERT_PASSWORD" -fd sha256 \
            -tr http://timestamp.digicert.com -td sha256 \
            "local-rag-setup-$APP_VERSION.exe"
          rm -f cert.pfx
          echo "Installer signiert."

      - name: Notarisieren – macOS .dmg (optional)
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          if [ -z "${MACOS_NOTARY_APPLE_ID:-}" ]; then
            echo "::notice::Keine Notary-Credentials — .dmg bleibt un-notarisiert."
            exit 0
          fi
          xcrun notarytool submit "local-rag-$APP_VERSION.dmg" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          xcrun stapler staple "local-rag-$APP_VERSION.dmg"
          echo ".dmg notarisiert und gestapelt."

      - name: Artefakte einsammeln
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "../out/${{ matrix.artifact }}.zip" local-rag >/dev/null)
          else
            (cd dist && tar czf "../out/${{ matrix.artifact }}.tar.gz" local-rag.app)
          fi
          mv local-rag-setup-*.exe out/ 2>/dev/null || true
          mv local-rag-*.dmg out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn
          retention-days: 14

  # Linux im Debian-trixie-Container (Begründung siehe Kopf).
  build-linux:
    name: Bundle (debian-trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      # Systempakete zuerst (der Container ist nackt): Python, Build-Werkzeuge,
      # PyGObject/WebKit fürs native Fenster, dpkg/fakeroot fürs .deb, git für
      # den Checkout.
      - name: Systempakete
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-dev python3-pip \
            git ca-certificates build-essential cmake pkg-config \
            libgirepository1.0-dev libcairo2-dev \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 \
            fakeroot dpkg-dev

      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="0.1.0"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Bundle bauen
        run: |
          python3 -m venv /venv
          . /venv/bin/activate
          pip install --upgrade pip
          # torch-CPU explizit (das PyPI-Linux-Wheel wäre der ~2 GB CUDA-Build).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # PyGObject < 3.52 bleibt bei girepository-1.0 / WebKit2-4.1 (Debian 13
          # hat kein girepository-2.0, das 3.52+ verlangt).
          pip install "PyGObject<3.52"
          pip install -e ".[ingest,generate,gui,native,onnx]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install pyinstaller
          pyinstaller packaging/pyinstaller/local-rag.spec --noconfirm --clean

      - name: Installer .deb
        run: bash packaging/deb/build-deb.sh "$APP_VERSION" dist/local-rag .

      - name: Artefakte einsammeln
        run: |
          mkdir -p out
          tar czf "out/local-rag-linux-x64.tar.gz" -C dist local-rag
          mv local-rag_*_*.deb out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: local-rag-linux-x64
          path: out/*
          if-no-files-found: warn
          retention-days: 14
